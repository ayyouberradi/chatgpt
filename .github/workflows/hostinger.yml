name: Deploy to Hostinger
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hostinger-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: 92.113.18.197
      SSH_PORT: '65002'
      SSH_USER: u808335549
      DEPLOY_ROOT: /home/u808335549/domains/salmon-turtle-767162.hostingersite.com
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, dom, xml, pdo_sqlite, sqlite3, curl, zip, fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and validate frontend
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run typecheck --prefix frontend
          node scripts/build.mjs
      - name: Validate backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --force
          php artisan test
      - name: Package production dependencies
        run: |
          python3 scripts/package-hostinger.py
          mkdir release
          unzip -q ../chatgpt-hostinger.zip -d release
      - name: Configure authenticated SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo 'Set HOSTINGER_SSH_KEY in repository secrets.'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'Set HOSTINGER_KNOWN_HOSTS in repository secrets.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/hostinger-ssh"
          chmod 700 "$RUNNER_TEMP/hostinger-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/hostinger-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$RUNNER_TEMP/hostinger-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/hostinger-ssh/key" "$RUNNER_TEMP/hostinger-ssh/known_hosts"
          if ! ssh-keygen -y -P '' -f "$RUNNER_TEMP/hostinger-ssh/key" >/dev/null 2>&1; then
            echo 'HOSTINGER_SSH_KEY must contain the complete private key with no passphrase. Copy ~/.ssh/hostinger_github directly into the GitHub secret; do not use the .pub file.'
            exit 1
          fi
          if ! ssh-keygen -F "[$SSH_HOST]:$SSH_PORT" -f "$RUNNER_TEMP/hostinger-ssh/known_hosts" >/dev/null; then
            echo 'HOSTINGER_KNOWN_HOSTS has no matching server entry. Copy the trusted records from your local known_hosts file.'
            exit 1
          fi
      - name: Upload and apply update
        run: |
          remote_release="$DEPLOY_ROOT/.github-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_options=(-i "$RUNNER_TEMP/hostinger-ssh/key" -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/hostinger-ssh/known_hosts")
          run_stage() {
            local stage="$1"
            shift
            if "$@" > "$RUNNER_TEMP/deploy-stage.log" 2>&1; then
              cat "$RUNNER_TEMP/deploy-stage.log"
            else
              cat "$RUNNER_TEMP/deploy-stage.log"
              python3 - "$stage" "$RUNNER_TEMP/deploy-stage.log" <<'PYCODE'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[2]).read_text(errors='replace').splitlines()
          errors = [line for line in lines if any(word in line.lower() for word in ('quota', 'no space', 'permission denied', 'rsync:', 'rsync error', 'read-only', 'failed to', 'cannot create'))]
          detail = ' | '.join(errors[-4:])[:1500] or 'See the deployment stage log.'
          message = (sys.argv[1] + ': ' + detail).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::' + message)
          PYCODE
              return 1
            fi
          }
          run_stage "Prepare staging storage" ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- '$DEPLOY_ROOT' '$remote_release'" < scripts/hostinger-staging.sh
          run_stage "Upload release" rsync -az -e "ssh -i $RUNNER_TEMP/hostinger-ssh/key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/hostinger-ssh/known_hosts" release/ "$SSH_USER@$SSH_HOST:$remote_release/"
          run_stage "Apply release" ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- '$remote_release'" < scripts/hostinger-update.sh
      - name: Check live responses
        run: |
          curl --fail --silent --show-error --retry 3 https://salmon-turtle-767162.hostingersite.com/manage/login > /dev/null
          curl --fail --silent --show-error --retry 3 https://salmon-turtle-767162.hostingersite.com/up > /dev/null
          curl --fail --silent --show-error --retry 3 -D "$RUNNER_TEMP/admin-headers.txt" https://salmon-turtle-767162.hostingersite.com/admin/media -o "$RUNNER_TEMP/admin-index.html"
          python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); h=(p/"admin-headers.txt").read_text().lower(); assert "no-store" in h; assert "/site/assets/index-" in (p/"admin-index.html").read_text()'
          curl --fail --silent --show-error --retry 3 https://salmon-turtle-767162.hostingersite.com/api/settings -o "$RUNNER_TEMP/live-settings.json"
          python3 -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/live-settings.json")); assert isinstance(d["admin_data"]["services"],list); assert "seo_data" in d'
          portal_status=$(curl --silent --show-error --retry 3 -o /dev/null -w '%{http_code}' https://salmon-turtle-767162.hostingersite.com/client)
          test "$portal_status" = 403 || { echo 'Client portal must deny requests without client access'; exit 1; }
          invalid_link_status=$(curl --silent --show-error --retry 3 -o /dev/null -w '%{http_code}' https://salmon-turtle-767162.hostingersite.com/client-access/invalid)
          test "$invalid_link_status" = 404 || { echo 'Invalid client links must be rejected'; exit 1; }
      - name: Remove runner SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/hostinger-ssh"
